<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FPCC Officer Dashboard</title>
<style>
:root{font-family:Inter,system-ui,Arial,sans-serif;color:#16352e;background:#eef5f1}
*{box-sizing:border-box} body{margin:0}
header{background:#0f5a46;color:#fff;padding:18px 24px}
header h1{margin:0;font-size:22px} header p{margin:5px 0 0;opacity:.9}
main{max-width:1500px;margin:auto;padding:20px}
.cards{display:grid;grid-template-columns:repeat(6,minmax(130px,1fr));gap:12px;margin-bottom:16px}
.card{background:#fff;border-radius:12px;padding:15px;box-shadow:0 2px 10px #0000000d}
.card b{display:block;font-size:26px;margin-top:5px}
.filters{display:grid;grid-template-columns:2fr repeat(4,1fr) auto auto;gap:8px;background:#fff;padding:12px;border-radius:12px;margin-bottom:12px}
input,select,textarea,button{font:inherit;border:1px solid #b8c9c2;border-radius:8px;padding:9px}
button{cursor:pointer;background:#0f5a46;color:#fff;border:none}
button.secondary{background:#fff;color:#0f5a46;border:1px solid #0f5a46}
.table-wrap{overflow:auto;background:#fff;border-radius:12px}
table{border-collapse:collapse;width:100%;min-width:1200px}
th,td{padding:10px;border-bottom:1px solid #e7ece9;text-align:left;vertical-align:top;font-size:13px}
th{background:#f7faf8;position:sticky;top:0}
.badge{display:inline-block;padding:4px 7px;border-radius:20px;background:#e8f2ee}
dialog{border:none;border-radius:12px;width:min(650px,95vw);padding:0}
dialog::backdrop{background:#0008}
.modal{padding:18px}.modal h2{margin-top:0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid .full{grid-column:1/-1}
label{display:block;font-size:12px;font-weight:700;margin-bottom:4px}
textarea{width:100%;min-height:100px}
.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:15px}
.small{color:#60756e;font-size:12px}
@media(max-width:900px){.cards{grid-template-columns:repeat(2,1fr)}.filters{grid-template-columns:1fr 1fr}.filters input{grid-column:1/-1}}
</style>
</head>
<body>
<header>
  <h1>Fort Portal City Council — Officer Dashboard</h1>
  <p>FPCC Codex Innovations · Citizen reports and service-delivery follow-up</p>
</header>
<main>
  <section class="cards">
    <div class="card">Total<b id="total">–</b></div>
    <div class="card">Submitted<b id="submitted">–</b></div>
    <div class="card">In progress<b id="in_progress">–</b></div>
    <div class="card">Resolved<b id="resolved">–</b></div>
    <div class="card">Over 7 days<b id="overdue">–</b></div>
    <div class="card">Avg. resolve hrs<b id="avg_resolution_hours">–</b></div>
  </section>

  <section class="filters">
    <input id="q" placeholder="Search reference, location, description, officer...">
    <select id="status"><option value="">All statuses</option><option>submitted</option><option>in progress</option><option>resolved</option><option>closed</option><option>rejected</option></select>
    <select id="priority"><option value="">All priorities</option><option>low</option><option>normal</option><option>high</option><option>urgent</option></select>
    <input id="department" placeholder="Department">
    <select id="source"><option value="">All sources</option><option>web</option><option>whatsapp</option></select>
    <button id="refresh">Refresh</button>
    <button id="export" class="secondary">Export CSV</button>
  </section>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Reference</th><th>Date</th><th>Category</th><th>Location</th>
          <th>Description</th><th>Department</th><th>Assigned</th>
          <th>Priority</th><th>Status</th><th>Source</th><th></th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
</main>

<dialog id="editor">
  <form method="dialog" class="modal" id="editForm">
    <h2 id="editTitle">Update report</h2>
    <div class="grid">
      <div>
        <label>Status</label>
        <select id="editStatus"><option>submitted</option><option>in progress</option><option>resolved</option><option>closed</option><option>rejected</option></select>
      </div>
      <div>
        <label>Priority</label>
        <select id="editPriority"><option>low</option><option>normal</option><option>high</option><option>urgent</option></select>
      </div>
      <div>
        <label>Department</label>
        <input id="editDepartment" maxlength="100">
      </div>
      <div>
        <label>Assigned officer</label>
        <input id="editAssigned" maxlength="150">
      </div>
      <div class="full">
        <label>Resolution / follow-up notes</label>
        <textarea id="editNotes" maxlength="5000"></textarea>
      </div>
    </div>
    <p class="small" id="editMeta"></p>
    <div class="actions">
      <button value="cancel" class="secondary">Cancel</button>
      <button type="button" id="saveEdit">Save changes</button>
    </div>
  </form>
</dialog>

<script>
const $=s=>document.querySelector(s);
let reports=[], current=null;

function params(){
  const p=new URLSearchParams();
  for(const id of ['q','status','priority','department','source']){
    const v=$('#'+id).value.trim(); if(v) p.set(id,v);
  }
  return p;
}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function fmtDate(v){return v?new Date(v).toLocaleString():'—'}

async function loadStats(){
  const r=await fetch('/api/admin/stats');
  if(!r.ok) throw new Error('Unable to load statistics');
  const s=await r.json();
  for(const k of ['total','submitted','in_progress','resolved','overdue','avg_resolution_hours']){
    $('#'+k).textContent=s[k]??0;
  }
}
async function loadReports(){
  const r=await fetch('/api/admin/reports?'+params());
  if(!r.ok) throw new Error('Unable to load reports');
  reports=(await r.json()).reports;
  $('#rows').innerHTML=reports.map((x,i)=>`
    <tr>
      <td><b>${esc(x.reference)}</b></td>
      <td>${esc(fmtDate(x.created_at))}</td>
      <td>${esc(x.category||x.type||'—')}</td>
      <td>${esc(x.location||'—')}</td>
      <td>${esc((x.description||'').slice(0,150))}</td>
      <td>${esc(x.department||'Unassigned')}</td>
      <td>${esc(x.assigned_to||'—')}</td>
      <td><span class="badge">${esc(x.priority||'normal')}</span></td>
      <td><span class="badge">${esc(x.status||'submitted')}</span></td>
      <td>${esc(x.source||'—')}</td>
      <td><button onclick="editReport(${i})">Update</button></td>
    </tr>`).join('');
}
async function refresh(){
  try{await Promise.all([loadStats(),loadReports()])}
  catch(e){alert(e.message)}
}
window.editReport=i=>{
  current=reports[i];
  $('#editTitle').textContent='Update '+current.reference;
  $('#editStatus').value=current.status||'submitted';
  $('#editPriority').value=current.priority||'normal';
  $('#editDepartment').value=current.department||'';
  $('#editAssigned').value=current.assigned_to||'';
  $('#editNotes').value=current.resolution_notes||'';
  $('#editMeta').textContent=`Created ${fmtDate(current.created_at)} · Last updated ${fmtDate(current.updated_at)}`;
  $('#editor').showModal();
}
$('#saveEdit').onclick=async()=>{
  const payload={
    status:$('#editStatus').value,
    priority:$('#editPriority').value,
    department:$('#editDepartment').value.trim(),
    assigned_to:$('#editAssigned').value.trim(),
    resolution_notes:$('#editNotes').value.trim()
  };
  const r=await fetch('/api/admin/reports/'+encodeURIComponent(current.reference),{
    method:'PATCH',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify(payload)
  });
  if(!r.ok){const e=await r.json().catch(()=>({})); alert(e.error||'Update failed'); return}
  $('#editor').close(); await refresh();
}
$('#refresh').onclick=refresh;
$('#export').onclick=()=>location.href='/api/admin/export.csv?'+params();
for(const id of ['status','priority','source']) $('#'+id).onchange=refresh;
$('#department').onchange=refresh;
let timer; $('#q').oninput=()=>{clearTimeout(timer);timer=setTimeout(loadReports,350)};
refresh();
</script>
</body>
</html>
